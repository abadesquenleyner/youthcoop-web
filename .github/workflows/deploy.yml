name: Publicar en GitHub Pages

# Compila el sitio (React + Vite + TypeScript) y lo publica en GitHub Pages.
# Antes de usarlo: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# La URL del formulario (Google Apps Script) se lee del secreto o de la variable VITE_FORM_ENDPOINT del repositorio.

# Se dispara con CADA push a main, sin filtro de rutas a propósito: así también se publica cuando el panel /admin
# (Decap CMS) guarda content/fotos.json, content/textos/*.json o sube una foto a content/originales/ (cada guardado es un commit a main).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; si llega otro push, se cancela el que estaba en curso
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Avisar si falta la URL del formulario
        env:
          ENDPOINT: ${{ secrets.VITE_FORM_ENDPOINT || vars.VITE_FORM_ENDPOINT }}
        run: |
          if [ -z "$ENDPOINT" ]; then
            echo "::warning title=Formulario sin conectar::VITE_FORM_ENDPOINT no esta configurado (Settings > Secrets and variables > Actions). El sitio se publica, pero el formulario mostrara un error al enviar."
          fi

      # Genera las variantes 480/800/1200 de las 13 fotos desde content/originales (sharp) y actualiza site.json en este
      # entorno (no se guarda en el repositorio). `npm run build` lo vuelve a ejecutar como prebuild; la segunda vez no hace nada.
      - name: Procesar fotos (content/originales -> public/media/fotos)
        run: npm run media

      # Aplica los textos que edita el cliente (content/textos/*.json) sobre src/data/site.json, solo en los campos de texto permitidos
      # (lista blanca en scripts/textos-esquema.mjs). Los avisos (texto vacío, lista con otro tamaño...) salen como advertencias y no detienen
      # el despliegue; solo un archivo que no sea JSON válido lo detiene. `npm run build` lo vuelve a ejecutar como prebuild (sin cambios).
      - name: Aplicar textos (content/textos -> src/data/site.json)
        run: npm run textos

      - name: Compilar (tsc + vite build)
        env:
          VITE_FORM_ENDPOINT: ${{ secrets.VITE_FORM_ENDPOINT || vars.VITE_FORM_ENDPOINT }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

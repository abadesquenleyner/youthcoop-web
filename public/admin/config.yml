                    name: "titulo"
                    widget: "object"
                    collapsed: false
                    fields:
                      - { label: "Español", name: "es", widget: "string", required: true, pattern: ["^[\\s\\S]{0,40}$", "Máximo 40 caracteres: con más, el diseño de la página se desordena"], hint: "Espacio limitado: hasta 40 caracteres." }
                      - { label: "Inglés · vacío = se usa el español", name: "en", widget: "string", required: false, pattern: ["^[\\s\\S]{0,40}$", "Máximo 40 caracteres: con más, el diseño de la página se desordena"] }
                  - { label: "Dirección", name: "texto", widget: "text", required: true, pattern: ["^[\\s\\S]{0,160}$", "Máximo 160 caracteres: con más, el diseño de la página se desordena"], hint: "Con Enter bajas de línea." }

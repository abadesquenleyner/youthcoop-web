                      - { label: "Enlace de LinkedIn", name: "url", widget: "string", required: true, pattern: ["^(#|https?://[^\\s<>\"'`\\\\]+)$", "Escribe la dirección completa, empezando por https://"] }
                  - label: "Instagram"
                    name: "instagram"
                    widget: "object"
                    collapsed: false
                    fields:
                      - { label: "Enlace de Instagram", name: "url", widget: "string", required: true, pattern: ["^(#|https?://[^\\s<>\"'`\\\\]+)$", "Escribe la dirección completa, empezando por https://"] }
                  - label: "Facebook"
                    name: "facebook"
                    widget: "object"
                    collapsed: false
                    fields:
                      - { label: "Enlace de Facebook", name: "url", widget: "string", required: true, pattern: ["^(#|https?://[^\\s<>\"'`\\\\]+)$", "Escribe la dirección completa, empezando por https://"] }
                  - label: "TikTok"
                    name: "tiktok"
                    widget: "object"
                    collapsed: false
                    fields:
                      - { label: "Enlace de TikTok", name: "url", widget: "string", required: false, pattern: ["^(#|https?://[^\\s<>\"'`\\\\]+)$", "Escribe la dirección completa, empezando por https://"], hint: "Mientras esté vacío, el ícono de TikTok no se muestra en la web." }
          - label: "Datos legales (pie de página)"
            name: "legal"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Razón social", name: "razon_social", widget: "string", required: true, pattern: ["^[\\s\\S]{0,80}$", "Máximo 80 caracteres: con más, el diseño de la página se desordena"] }

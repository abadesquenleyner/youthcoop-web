# Configuración de Decap CMS (panel /admin) para cambiar las fotos y los textos del sitio (sin crear ni borrar secciones ni páginas).
# El panel edita el repositorio de GitHub: guarda content/fotos.json (y sube la foto original a content/originales/) y content/textos/*.json.
# Al guardar, GitHub Actions recompila y republica el sitio solo (1 a 2 minutos).
#
# ===== COMPLETAR ANTES DE PUBLICAR (2 valores) =====
#   backend.repo      -> usuario/organización y nombre del repositorio, p. ej. youthcoop/sitio
#   backend.base_url  -> dirección del Worker de Cloudflare que hace el inicio de sesión con GitHub
#                        (ver cloudflare-oauth-worker/README.md y docs/PUESTA-EN-MARCHA.md)

backend:
  name: github
  repo: abadesquenleyner/youthcoop-web
  branch: main
  base_url: https://youthcoop-decap-oauth.cloudflare-oauth-worker.workers.dev
  auth_endpoint: auth
  commit_messages:
    create: 'Panel: crear {{path}}'
    update: 'Panel: actualizar {{collection}} ({{slug}})'
    delete: 'Panel: borrar {{path}}'
    uploadMedia: 'Panel: subir {{path}}'
    deleteMedia: 'Panel: borrar {{path}}'

# Solo se activa cuando se abre /admin desde localhost (prueba local con `npx decap-server`); en internet no hace nada.
local_backend: true

# Publicación directa a main (sin borradores ni revisión): "Publicar" = el cambio sale en 1 o 2 minutos.
publish_mode: simple

locale: es

# Logo de YOUTH COOP en la pantalla de entrada y en la barra superior del panel (en vez del de Decap)
logo:
  src: /media/logo-oscuro.png
  show_in_header: true

# Las fotos originales van al repositorio (no a la web). La web publica solo las versiones que genera scripts/build-media.mjs.
# public_folder con barra inicial: Decap lo toma como dirección web y muestra la miniatura desde https://youthcoop.pe/content/originales/
# (el despliegue copia content/originales a la web para eso). Sin barra, el panel intentaba leerla desde GitHub y no la mostraba.
# scripts/build-media.mjs quita la barra y lo resuelve como ruta dentro del repositorio.
media_folder: content/originales
public_folder: /content/originales

# (Decap no permite fijar un tope de subida con la biblioteca de medios por defecto: los límites son de la guía.
#  GitHub rechaza archivos de más de 100 MB; scripts/build-media.mjs avisa de los videos de más de 20 MB.)

# Barra lateral, en este orden: Fotos del sitio, Textos por sección, Productos, Contacto y ajustes.
# Las tres últimas colecciones están GENERADAS (bloque «TEXTOS» al final) desde scripts/textos-esquema.mjs con
# `npm run panel`; las listas no permiten agregar, quitar ni reordenar ítems (allow_add/allow_remove/allow_reorder en false).
collections:
  - name: fotos
    label: Fotos del sitio
    editor:
      preview: false
    files:
      - name: fotos
        label: Fotos del sitio
        file: content/fotos.json
        format: json
        fields:
          # ---------- Portada ----------
          - label: 'Foto principal (portada)'
            name: hero
            widget: object
            collapsed: true
            hint: 'Foto vertical (proporción 4:5, p. ej. 1200 × 1500 px). Si subes otra proporción, la web la recorta usando el punto focal.'
            fields: &campos_foto
              - label: 'Foto'
                name: imagen
                widget: image
                required: true
                allow_multiple: false
                choose_url: false
                hint: 'Sube la foto tal como sale de la cámara (JPG, PNG o WebP). La web la recorta y la optimiza sola.'
              - label: 'Texto alternativo (describe lo que se ve)'
                name: alt
                widget: object
                collapsed: false
                fields:
                  - { label: 'Español', name: es, widget: string, required: true, hint: 'Lo leen los lectores de pantalla y Google. Una frase corta.' }
                  - { label: 'Inglés', name: en, widget: string, required: false, hint: 'Si lo dejas vacío se usa el español.' }
              - label: 'Leyenda'
                name: leyenda
                widget: object
                collapsed: true
                hint: 'Respaldo del texto alternativo; no se ve escrita en la página.'
                required: false
                fields:
                  - { label: 'Español', name: es, widget: string, required: false }
                  - { label: 'Inglés', name: en, widget: string, required: false }
              - { label: 'Punto focal horizontal (0 = izquierda, 100 = derecha)', name: focal_x, widget: number, value_type: int, min: 0, max: 100, required: false, hint: 'Opcional. Vacío = centro (50). Úsalo para que el recorte no corte a la persona o el objeto importante.' }
              - { label: 'Punto focal vertical (0 = arriba, 100 = abajo)', name: focal_y, widget: number, value_type: int, min: 0, max: 100, required: false, hint: 'Opcional. Vacío = centro (50).' }

          # ---------- Nosotros ----------
          - label: 'Nosotros: equipo'
            name: nosotros
            widget: object
            collapsed: true
            hint: 'Foto horizontal (proporción 4:3, p. ej. 1200 × 900 px).'
            fields: *campos_foto

          # ---------- Proyectos ----------
          - label: 'Proyecto 1: Café + Árbol'
            name: proyecto_1
            widget: object
            collapsed: true
            hint: 'Foto horizontal (proporción 16:10, p. ej. 1600 × 1000 px).'
            fields: *campos_foto
          - label: 'Proyecto 2: Cacao Bosque+'
            name: proyecto_2
            widget: object
            collapsed: true
            hint: 'Foto horizontal (proporción 16:10, p. ej. 1600 × 1000 px).'
            fields: *campos_foto
          - label: 'Proyecto 3: Tierra de Jóvenes y Mujeres'
            name: proyecto_3
            widget: object
            collapsed: true
            hint: 'Foto horizontal (proporción 16:10, p. ej. 1600 × 1000 px).'
            fields: *campos_foto

          # ---------- Cacao ----------
          - label: 'Cacao en grano'
            name: cacao_grano
            widget: object
            collapsed: true
            hint: 'Foto panorámica (proporción 16:9, p. ej. 1600 × 900 px).'
            fields: *campos_foto
          - label: 'Derivados de cacao'
            name: cacao_derivados
            widget: object
            collapsed: true
            hint: 'Foto panorámica (proporción 16:9, p. ej. 1600 × 900 px).'
            fields: *campos_foto

          # ---------- Galería ----------
          - label: 'Galería 1: cosecha'
            name: galeria_1
            widget: object
            collapsed: true
            hint: 'Foto horizontal (proporción 4:3, p. ej. 1200 × 900 px).'
            fields: *campos_foto
          - label: 'Galería 2: cata de café'
            name: galeria_2
            widget: object
            collapsed: true
            hint: 'Foto horizontal (proporción 4:3, p. ej. 1200 × 900 px).'
            fields: *campos_foto
          - label: 'Galería 3: control de calidad'
            name: galeria_3
            widget: object
            collapsed: true
            hint: 'Foto horizontal (proporción 4:3, p. ej. 1200 × 900 px).'
            fields: *campos_foto
          - label: 'Galería 4: fermentación y secado de cacao'
            name: galeria_4
            widget: object
            collapsed: true
            hint: 'Foto horizontal (proporción 4:3, p. ej. 1200 × 900 px).'
            fields: *campos_foto
          - label: 'Galería 5: almacén'
            name: galeria_5
            widget: object
            collapsed: true
            hint: 'Foto horizontal (proporción 4:3, p. ej. 1200 × 900 px).'
            fields: *campos_foto
          - label: 'Galería 6: video de la sede (o una foto)'
            name: galeria_6
            widget: object
            collapsed: true
            hint: 'Este espacio puede ser un VIDEO (.mp4) o una foto 4:3. Si hay video, se muestra el video y la foto sirve de portada; si dejas el video vacío, se muestra la foto.'
            fields:
              - { label: 'Video (.mp4)', name: video, widget: file, required: false, allow_multiple: false, choose_url: false, hint: 'Archivo .mp4 (H.264). Pesa lo mejor posible: recomendado hasta 20 MB. GitHub no admite más de 100 MB.' }
              - { label: 'Foto o portada del video', name: imagen, widget: image, required: false, allow_multiple: false, choose_url: false, hint: 'Con video: es la imagen que se ve antes de darle play. Sin video: es la foto del espacio.' }
              - { label: 'Portada del video (reemplaza a la foto)', name: poster, widget: image, required: false, allow_multiple: false, choose_url: false, hint: 'Solo si quieres una portada distinta de la foto.' }
              - label: 'Texto alternativo (describe lo que se ve)'
                name: alt
                widget: object
                collapsed: false
                fields:
                  - { label: 'Español', name: es, widget: string, required: true, hint: 'Lo leen los lectores de pantalla y Google. Una frase corta.' }
                  - { label: 'Inglés', name: en, widget: string, required: false, hint: 'Si lo dejas vacío se usa el español.' }
              - label: 'Leyenda'
                name: leyenda
                widget: object
                collapsed: true
                hint: 'Respaldo del texto alternativo; no se ve escrita en la página.'
                required: false
                fields:
                  - { label: 'Español', name: es, widget: string, required: false }
                  - { label: 'Inglés', name: en, widget: string, required: false }
              - { label: 'Punto focal horizontal (0 = izquierda, 100 = derecha)', name: focal_x, widget: number, value_type: int, min: 0, max: 100, required: false, hint: 'Opcional. Vacío = centro (50). En el video decide qué parte se ve al recortarlo a 4:3.' }
              - { label: 'Punto focal vertical (0 = arriba, 100 = abajo)', name: focal_y, widget: number, value_type: int, min: 0, max: 100, required: false, hint: 'Opcional. Vacío = centro (50).' }

# >>> TEXTOS (generado por scripts/generar-panel-textos.mjs; no editar a mano: cambia scripts/textos-esquema.mjs y vuelve a generar)
  - name: "textos"
    label: "Textos por sección"
    description: "Cambia los textos de cada parte de la página, en español y en inglés. Elige una sección de la lista."
    editor:
      preview: false
    files:
      - name: "header"
        label: "Menú superior (cabecera)"
        description: "Las palabras del menú de arriba y el botón «Solicitar muestras»."
        file: "content/textos/header.json"
        format: "json"
        fields:
          - label: "Enlaces del menú"
            label_singular: "Enlace"
            name: "nav"
            widget: "list"
            allow_add: false
            allow_remove: false
            allow_reorder: false
            collapsed: true
            summary: "{{fields.label.es}}"
            min: 7
            max: 7
            fields:
              - label: "Texto del enlace"
                name: "label"
                widget: "object"
                collapsed: false
                fields:
                  - label: "Español"
                    name: "es"
                    widget: "string"
                    required: true
                    pattern: ["^[\\s\\S]{0,24}$", "Máximo 24 caracteres: con más, el diseño de la página se desordena"]
                    hint: "Cada enlace lleva a su sección: el destino no se cambia desde aquí. Espacio limitado: hasta 24 caracteres."
                  - { label: "Inglés · vacío = se usa el español", name: "en", widget: "string", required: false, pattern: ["^[\\s\\S]{0,24}$", "Máximo 24 caracteres: con más, el diseño de la página se desordena"] }
          - label: "Botón de la cabecera"
            name: "cta"
            widget: "object"
            collapsed: false
            fields:
              - label: "Texto del botón"
                name: "label"
                widget: "object"
                collapsed: false
                fields:
                  - { label: "Español", name: "es", widget: "string", required: true, pattern: ["^[\\s\\S]{0,32}$", "Máximo 32 caracteres: con más, el diseño de la página se desordena"], hint: "Espacio limitado: hasta 32 caracteres." }
                  - { label: "Inglés · vacío = se usa el español", name: "en", widget: "string", required: false, pattern: ["^[\\s\\S]{0,32}$", "Máximo 32 caracteres: con más, el diseño de la página se desordena"] }
          - label: "Textos para lectores de pantalla (no se ven en la página)"
            name: "aria"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Nombre del logo", name: "inicio", widget: "string", required: true, pattern: ["^[\\s\\S]{0,60}$", "Máximo 60 caracteres: con más, el diseño de la página se desordena"] }
              - { label: "Nombre del menú", name: "nav", widget: "string", required: true, pattern: ["^[\\s\\S]{0,40}$", "Máximo 40 caracteres: con más, el diseño de la página se desordena"], hint: "Espacio limitado: hasta 40 caracteres." }
              - { label: "Nombre del selector de idioma", name: "idioma", widget: "string", required: true, pattern: ["^[\\s\\S]{0,40}$", "Máximo 40 caracteres: con más, el diseño de la página se desordena"], hint: "Espacio limitado: hasta 40 caracteres." }
              - { label: "Botón del menú en celular", name: "menu", widget: "string", required: true, pattern: ["^[\\s\\S]{0,30}$", "Máximo 30 caracteres: con más, el diseño de la página se desordena"], hint: "Espacio limitado: hasta 30 caracteres." }
      - name: "hero"
        label: "Inicio (portada)"
        description: "Título grande, texto de introducción, botones y sellos de la portada."
        file: "content/textos/hero.json"
        format: "json"
        fields:
          - label: "Título"
            name: "titulo"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Español", name: "es", widget: "string", required: true, pattern: ["^[\\s\\S]{0,130}$", "Máximo 130 caracteres: con más, el diseño de la página se desordena"] }
              - { label: "Inglés · vacío = se usa el español", name: "en", widget: "string", required: false, pattern: ["^[\\s\\S]{0,130}$", "Máximo 130 caracteres: con más, el diseño de la página se desordena"] }
          - label: "Texto de introducción"
            name: "bajada"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Español", name: "es", widget: "text", required: true, pattern: ["^[\\s\\S]{0,420}$", "Máximo 420 caracteres: con más, el diseño de la página se desordena"] }
              - { label: "Inglés · vacío = se usa el español", name: "en", widget: "text", required: false, pattern: ["^[\\s\\S]{0,420}$", "Máximo 420 caracteres: con más, el diseño de la página se desordena"] }
          - label: "Botón principal"
            name: "cta_principal"
            widget: "object"
            collapsed: false
            fields:
              - label: "Texto del botón"
                name: "label"
                widget: "object"
                collapsed: false
                fields:
                  - { label: "Español", name: "es", widget: "string", required: true, pattern: ["^[\\s\\S]{0,32}$", "Máximo 32 caracteres: con más, el diseño de la página se desordena"], hint: "Espacio limitado: hasta 32 caracteres." }
                  - { label: "Inglés · vacío = se usa el español", name: "en", widget: "string", required: false, pattern: ["^[\\s\\S]{0,32}$", "Máximo 32 caracteres: con más, el diseño de la página se desordena"] }
          - label: "Botón secundario"
            name: "cta_secundario"
            widget: "object"
            collapsed: false
            fields:
              - label: "Texto del botón"
                name: "label"
                widget: "object"
                collapsed: false
                fields:
                  - { label: "Español", name: "es", widget: "string", required: true, pattern: ["^[\\s\\S]{0,32}$", "Máximo 32 caracteres: con más, el diseño de la página se desordena"], hint: "Espacio limitado: hasta 32 caracteres." }
                  - { label: "Inglés · vacío = se usa el español", name: "en", widget: "string", required: false, pattern: ["^[\\s\\S]{0,32}$", "Máximo 32 caracteres: con más, el diseño de la página se desordena"] }
          - { label: "Línea de sellos y certificaciones", name: "sellos", widget: "string", required: true, pattern: ["^[\\s\\S]{0,90}$", "Máximo 90 caracteres: con más, el diseño de la página se desordena"], hint: "Ejemplo: Orgánico UE · NOP · COR · Fairtrade" }
      - name: "cifras"
        label: "Cifras (franja de números)"
        description: "Los 4 números destacados debajo de la portada."
        file: "content/textos/cifras.json"
        format: "json"
        fields:
          - label: "Cifras"
            label_singular: "Cifra"
            name: "items"
            widget: "list"
            allow_add: false
            allow_remove: false
            allow_reorder: false
            collapsed: true
            summary: "{{fields.valor}} {{fields.etiqueta.es}}"
            min: 4
            max: 4
            fields:
              - label: "Número"
                name: "valor"
                widget: "string"
                required: true
                pattern: ["^[\\s\\S]{0,12}$", "Máximo 12 caracteres: con más, el diseño de la página se desordena"]
                hint: "Ejemplo: +100 ha. Si escribes [000] entre corchetes, la cifra queda oculta hasta que pongas el dato real. Espacio limitado: hasta 12 caracteres."
              - label: "Qué significa"
                name: "etiqueta"
                widget: "object"
                collapsed: false
                fields:
                  - { label: "Español", name: "es", widget: "string", required: true, pattern: ["^[\\s\\S]{0,70}$", "Máximo 70 caracteres: con más, el diseño de la página se desordena"] }
                  - { label: "Inglés · vacío = se usa el español", name: "en", widget: "string", required: false, pattern: ["^[\\s\\S]{0,70}$", "Máximo 70 caracteres: con más, el diseño de la página se desordena"] }
      - name: "nosotros"
        label: "Nosotros"

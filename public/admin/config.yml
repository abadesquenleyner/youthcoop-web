          - label: "Etiqueta pequeña (sobre el título)"
            name: "etiqueta"
            widget: "object"
            collapsed: false
            fields:
              - label: "Español"
                name: "es"
                widget: "string"
                required: true
                pattern: ["^[\\s\\S]{0,40}$", "Máximo 40 caracteres: con más, el diseño de la página se desordena"]
                hint: "La frase corta en mayúsculas que va sobre el título. Espacio limitado: hasta 40 caracteres."
              - { label: "Inglés · vacío = se usa el español", name: "en", widget: "string", required: false, pattern: ["^[\\s\\S]{0,40}$", "Máximo 40 caracteres: con más, el diseño de la página se desordena"] }
          - label: "Título"
            name: "titulo"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Español", name: "es", widget: "string", required: true, pattern: ["^[\\s\\S]{0,120}$", "Máximo 120 caracteres: con más, el diseño de la página se desordena"] }
              - { label: "Inglés · vacío = se usa el español", name: "en", widget: "string", required: false, pattern: ["^[\\s\\S]{0,120}$", "Máximo 120 caracteres: con más, el diseño de la página se desordena"] }
          - label: "Párrafos"
            label_singular: "Párrafo"
            name: "parrafos"
            widget: "list"
            allow_add: false
            allow_remove: false
            allow_reorder: false
            collapsed: true
            summary: "{{fields.texto.es | truncate(60)}}"
            min: 2
            max: 2
            fields:
              - label: "Párrafo"
                name: "texto"
                widget: "object"
                collapsed: false
                fields:
                  - { label: "Español", name: "es", widget: "text", required: true, pattern: ["^[\\s\\S]{0,500}$", "Máximo 500 caracteres: con más, el diseño de la página se desordena"] }
                  - { label: "Inglés · vacío = se usa el español", name: "en", widget: "text", required: false, pattern: ["^[\\s\\S]{0,500}$", "Máximo 500 caracteres: con más, el diseño de la página se desordena"] }
          - label: "Hitos de la línea de tiempo"
            label_singular: "Hito"
            name: "hitos"
            widget: "list"
            allow_add: false
            allow_remove: false
            allow_reorder: false
            collapsed: true
            summary: "{{fields.anio.es}}: {{fields.titulo.es}}"
            min: 5
            max: 5
            fields:
              - label: "Años"
                name: "anio"
                widget: "object"
                collapsed: false
                fields:
                  - { label: "Español", name: "es", widget: "string", required: true, pattern: ["^[\\s\\S]{0,20}$", "Máximo 20 caracteres: con más, el diseño de la página se desordena"], hint: "Espacio limitado: hasta 20 caracteres." }
                  - { label: "Inglés · vacío = se usa el español", name: "en", widget: "string", required: false, pattern: ["^[\\s\\S]{0,20}$", "Máximo 20 caracteres: con más, el diseño de la página se desordena"] }
              - label: "Título del hito"
                name: "titulo"
                widget: "object"
                collapsed: false
                fields:
                  - { label: "Español", name: "es", widget: "string", required: true, pattern: ["^[\\s\\S]{0,60}$", "Máximo 60 caracteres: con más, el diseño de la página se desordena"] }
                  - { label: "Inglés · vacío = se usa el español", name: "en", widget: "string", required: false, pattern: ["^[\\s\\S]{0,60}$", "Máximo 60 caracteres: con más, el diseño de la página se desordena"] }
              - label: "Texto del hito"
                name: "texto"
                widget: "object"
                collapsed: false
                fields:
                  - { label: "Español", name: "es", widget: "text", required: true, pattern: ["^[\\s\\S]{0,220}$", "Máximo 220 caracteres: con más, el diseño de la página se desordena"] }
                  - { label: "Inglés · vacío = se usa el español", name: "en", widget: "text", required: false, pattern: ["^[\\s\\S]{0,220}$", "Máximo 220 caracteres: con más, el diseño de la página se desordena"] }
      - name: "modelo"
        label: "Nuestro modelo"
        description: "Los cinco pilares de la gestión de fincas."
        file: "content/textos/modelo.json"
        format: "json"
        fields:
          - label: "Etiqueta pequeña (sobre el título)"
            name: "etiqueta"
            widget: "object"
            collapsed: false
            fields:
              - label: "Español"
                name: "es"
                widget: "string"
                required: true
                pattern: ["^[\\s\\S]{0,40}$", "Máximo 40 caracteres: con más, el diseño de la página se desordena"]
                hint: "La frase corta en mayúsculas que va sobre el título. Espacio limitado: hasta 40 caracteres."
              - { label: "Inglés · vacío = se usa el español", name: "en", widget: "string", required: false, pattern: ["^[\\s\\S]{0,40}$", "Máximo 40 caracteres: con más, el diseño de la página se desordena"] }
          - label: "Título"
            name: "titulo"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Español", name: "es", widget: "string", required: true, pattern: ["^[\\s\\S]{0,120}$", "Máximo 120 caracteres: con más, el diseño de la página se desordena"] }
              - { label: "Inglés · vacío = se usa el español", name: "en", widget: "string", required: false, pattern: ["^[\\s\\S]{0,120}$", "Máximo 120 caracteres: con más, el diseño de la página se desordena"] }
          - label: "Texto de introducción"
            name: "bajada"
            widget: "object"
            collapsed: false

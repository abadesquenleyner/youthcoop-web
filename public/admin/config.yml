  - name: "ajustes"
    label: "Contacto y ajustes"
    description: "Correos, WhatsApp, direcciones, redes, título para Google, datos legales y avisos del formulario."
    editor:
      preview: false
    files:
      - name: "ajustes"
        label: "Contacto, buscadores y datos legales"
        description: "Correos, WhatsApp, direcciones, redes sociales, título y descripción para Google, razón social y RUC."
        file: "content/textos/ajustes.json"
        format: "json"
        fields:
          - label: "Título y descripción en Google"
            name: "seo"
            widget: "object"
            collapsed: false
            fields:
              - label: "En español"
                name: "es"
                widget: "object"
                collapsed: false
                fields:
                  - label: "Título de la pestaña y de Google"
                    name: "title"
                    widget: "string"
                    required: true
                    pattern: ["^[\\s\\S]{0,120}$", "Máximo 120 caracteres: con más, el diseño de la página se desordena"]
                    hint: "Es lo que aparece en la pestaña del navegador y como título en Google."
                  - label: "Descripción para Google"
                    name: "description"
                    widget: "text"
                    required: true
                    pattern: ["^[\\s\\S]{0,320}$", "Máximo 320 caracteres: con más, el diseño de la página se desordena"]
                    hint: "Una o dos frases que resumen la empresa (recomendado hasta 160 caracteres)."
              - label: "En inglés"
                name: "en"
                widget: "object"
                collapsed: false
                fields:
                  - { label: "Título (inglés)", name: "title", widget: "string", required: true, pattern: ["^[\\s\\S]{0,120}$", "Máximo 120 caracteres: con más, el diseño de la página se desordena"] }
                  - { label: "Descripción (inglés)", name: "description", widget: "text", required: false, pattern: ["^[\\s\\S]{0,320}$", "Máximo 320 caracteres: con más, el diseño de la página se desordena"], hint: "Si la dejas vacía se usa la española." }
          - label: "Datos de contacto"
            name: "contacto"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Correo comercial", name: "email_comercial", widget: "string", required: true, pattern: ["^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$", "Escribe un correo válido, por ejemplo nombre@empresa.com"] }
              - { label: "Correo de logística", name: "email_logistica", widget: "string", required: true, pattern: ["^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$", "Escribe un correo válido, por ejemplo nombre@empresa.com"] }
              - label: "Número de WhatsApp (solo números)"
                name: "whatsapp_numero"
                widget: "string"
                required: true
                pattern: ["^[0-9]{8,15}$", "Solo números, con el código del país y sin + ni espacios. Ejemplo: 51974289199"]
                hint: "Con código de país, sin + ni espacios (ejemplo: 51974289199). También actualiza solo el enlace de la red WhatsApp."
              - label: "Texto del botón de WhatsApp"
                name: "whatsapp_texto"
                widget: "string"
                required: true
                pattern: ["^[\\s\\S]{0,40}$", "Máximo 40 caracteres: con más, el diseño de la página se desordena"]
                hint: "Cómo se lee en el botón de la sección Contacto. Ejemplo: WhatsApp +51 974 289 199 Espacio limitado: hasta 40 caracteres."
              - label: "WhatsApp que se muestra en el pie"
                name: "whatsapp_pie"
                widget: "string"
                required: true
                pattern: ["^[\\s\\S]{0,30}$", "Máximo 30 caracteres: con más, el diseño de la página se desordena"]
                hint: "Ejemplo: +51 974 289 199 Espacio limitado: hasta 30 caracteres."
              - { label: "Dirección web que se muestra en el pie", name: "sitio_web", widget: "string", required: true, pattern: ["^[\\s\\S]{0,60}$", "Máximo 60 caracteres: con más, el diseño de la página se desordena"] }
              - label: "Direcciones"
